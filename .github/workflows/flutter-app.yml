name: Flutter App

on:
  push:
    branches: [ main ]
    paths: [ 'opendockify-app/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'opendockify-app/**' ]

jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendockify-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test